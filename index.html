<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVEN Clocking — Olympic Paints</title>
<meta http-equiv="refresh" content="3; url=https://op-workspace-dashboard.vercel.app/clocking">
<link rel="canonical" href="https://op-workspace-dashboard.vercel.app/clocking">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0D0D0B;color:#E8E7E2;font-family:'Barlow',sans-serif;height:100%;}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;}
  .badge{width:88px;height:88px;border-radius:50%;overflow:hidden;background:#F5C400;margin-bottom:24px;}
  .badge img{display:block;width:100%;height:100%;object-fit:cover;}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:48px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 8px;color:#FAE04D;}
  p{font-size:16px;line-height:1.55;max-width:520px;color:#C8C7C0;margin:8px 0;}
  a.btn{display:inline-block;margin-top:24px;background:#F5C400;color:#0D0D0B;text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;padding:14px 28px;border-radius:8px;box-shadow:0 4px 20px rgba(245,196,0,0.15);}
  a.btn:hover{background:#FAE04D;}
  .muted{font-size:12px;color:#5C5B58;margin-top:32px;letter-spacing:.08em;text-transform:uppercase;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge"><img src="logo.jpg" alt="Olympic Paints" onerror="this.parentElement.style.display='none'"></div>
    <h1>This dashboard has moved</h1>
    <p>The HAVEN Clocking Dashboard is now hosted on the Olympic Paints workspace hub.</p>
    <p>You will be redirected automatically in a few seconds.</p>
    <a class="btn" href="https://op-workspace-dashboard.vercel.app/clocking">Open new dashboard &rarr;</a>
    <p class="muted">op-workspace-dashboard.vercel.app/clocking</p>
  </div>
  <script>setTimeout(function(){location.replace('https://op-workspace-dashboard.vercel.app/clocking');},2500);</script>
</body>
</html>
